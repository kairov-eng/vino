# Gemini Vision Proxy — деплой на aidispatcher (как siglip2/dinov3).
# Автозапуск: restart: unless-stopped
#
# На сервере:
#   /opt/gemini-vision-proxy
#   docker compose up -d --build
#
# Публичный HTTPS: https://vino-svoe.online/health  (+ /v1/...)
# Порт 8093 остаётся для прямого доступа: http://127.0.0.1:8093/health
#
# Локальный клиент: GEMINI_PROXY_URL=https://vino-svoe.online

services:
  gemini-proxy:
    build: .
    image: vino-gemini-vision-proxy:latest
    container_name: vino-gemini-vision-proxy
    ports:
      - "8093:8093"
    env_file:
      - .env
    environment:
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_MAX_RPM: ${GEMINI_MAX_RPM:-15}
      GEMINI_RPM_WINDOW_SEC: ${GEMINI_RPM_WINDOW_SEC:-60}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    networks:
      - default
      - aidnet
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8093/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  aidnet:
    external: true
    name: aidispatcher_aidnet
