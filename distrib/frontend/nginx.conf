server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep open file descriptors / dir listings for hot media files
    open_file_cache max=4000 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → vino_backend (same Docker network)
    location /api/ {
        proxy_pass http://vino_backend:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 25m;
    }

    # Catalog thumbs (optional mount VINO_MEDIA_THUMBS_HOST → /data/media_thumbs)
    location /media/t/ {
        alias /data/media_thumbs/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # Static wine photos — host bind-mount (see docker-compose VINO_MEDIA_HOST).
    # Do NOT proxy through FastAPI (single worker = slow under parallel <img>).
    location /media/ {
        alias /data/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff;
        open_file_cache max=4000 inactive=60s;
        open_file_cache_valid 30s;
        open_file_cache_min_uses 2;
        open_file_cache_errors on;
    }
}
