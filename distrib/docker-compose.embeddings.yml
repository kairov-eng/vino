# SigLIP2 + DINOv3 — как на prod (aidispatcher).
# На сервере контейнеры сейчас крутятся из /opt/siglip2 и /opt/dinov3
# (те же image/ports/networks). Этот файл — канон в репозитории для
# воспроизведения того же стека из vino-svoe/services/*.
#
# Контейнеры: siglip2-embed (:8090), dinov3-embed (:8091)
# Сеть: aidispatcher_aidnet → nginx /api_siglip2 /api_dinov3
#
# Запуск из vino-svoe/:
#   cp distrib/embeddings.env.example distrib/embeddings.env  # заполнить ключи
#   docker compose -f distrib/docker-compose.embeddings.yml \
#     --env-file distrib/embeddings.env up -d --build
#
# Эквивалент на проде (исторические каталоги):
#   cd /opt/siglip2 && docker compose up -d
#   cd /opt/dinov3  && docker compose up -d
#
# Host 8091 занят dinov3 — vino_frontend поэтому на 8088 (docker-compose.yml).

name: vino_embeddings

services:
  siglip2:
    build:
      context: ../services/siglip-server
      dockerfile: Dockerfile
    image: siglip2-embed:cpu
    container_name: siglip2-embed
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    env_file:
      - embeddings.env
    environment:
      DEVICE: cpu
      SIGLIP_MODEL: ${SIGLIP_MODEL:-google/siglip2-base-patch16-384}
      SIGLIP_API_KEY: ${SIGLIP_API_KEY:-}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL:-0}
      TORCH_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      OCR_WORKERS: ${OCR_WORKERS:-4}
      OCR_THREADS: ${OCR_THREADS:-1}
      MALLOC_ARENA_MAX: "2"
      MALLOC_TRIM_THRESHOLD_: "131072"
      DNNL_MAX_CPU_ISA: SSE41
      ATEN_CPU_CAPABILITY: default
      HF_HOME: /cache/huggingface
    volumes:
      - siglip_hf_cache:/cache/huggingface
    mem_limit: 2600m
    cpus: 4.0
    networks:
      - default
      - aidnet
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  dinov3:
    build:
      context: ../services/dinov3-server
      dockerfile: Dockerfile
    image: dinov3-embed:cpu
    container_name: dinov3-embed
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8091"
    env_file:
      - embeddings.env
    environment:
      DEVICE: cpu
      DINO_MODEL: ${DINO_MODEL:-facebook/dinov3-vitb16-pretrain-lvd1689m}
      DINO_API_KEY: ${DINO_API_KEY:-}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL:-0}
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      TORCH_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      DNNL_MAX_CPU_ISA: SSE41
      ATEN_CPU_CAPABILITY: default
      HF_HOME: /cache/huggingface
    volumes:
      - dinov3_hf_cache:/cache/huggingface
    mem_limit: 2400m
    cpus: 2.0
    networks:
      - default
      - aidnet
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8091/health"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 600s

networks:
  aidnet:
    external: true
    name: ${AIDNET_NAME:-aidispatcher_aidnet}

volumes:
  siglip_hf_cache:
  dinov3_hf_cache:
