# CPU embedding endpoints on the same host as vino_* (vino-svoe.online).
# Containers: siglip2-embed (:8090), dinov3-embed (:8091)
# Join aidispatcher_aidnet so host nginx can proxy:
#   /api_siglip2/ → siglip2-embed:8090
#   /api_dinov3/  → dinov3-embed:8091
#
# From vino-svoe/:
#   docker compose -f distrib/docker-compose.embeddings.yml \
#     --env-file distrib/embeddings.env up -d --build
#
# Do NOT map dinov3 to host 8091 at the same time as Vite frontend (also 8091).
# On prod Vite is not used; vino_frontend listens on 8088 (see docker-compose.yml).

name: vino_embeddings

services:
  siglip2:
    build:
      context: ../services/siglip-server
      dockerfile: Dockerfile
    image: siglip2-embed:cpu
    container_name: siglip2-embed
    restart: unless-stopped
    ports:
      - "${SIGLIP2_HOST_PORT:-127.0.0.1:8090}:8090"
    env_file:
      - embeddings.env
    environment:
      DEVICE: ${SIGLIP2_DEVICE:-cpu}
      SIGLIP_MODEL: ${SIGLIP_MODEL:-google/siglip2-base-patch16-384}
      SIGLIP_API_KEY: ${SIGLIP_API_KEY:-${EMBED_API_KEY:-}}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL:-0}
      TORCH_NUM_THREADS: ${SIGLIP2_TORCH_THREADS:-2}
      OMP_NUM_THREADS: ${SIGLIP2_TORCH_THREADS:-2}
      OCR_WORKERS: ${OCR_WORKERS:-4}
      OCR_THREADS: ${OCR_THREADS:-1}
      MALLOC_ARENA_MAX: "2"
      MALLOC_TRIM_THRESHOLD_: "131072"
      DNNL_MAX_CPU_ISA: SSE41
      ATEN_CPU_CAPABILITY: default
      HF_HOME: /cache/huggingface
    volumes:
      - ${SIGLIP2_HF_CACHE_HOST:-/var/lib/vino-svoe/hf-cache/siglip2}:/cache/huggingface
    mem_limit: ${SIGLIP2_MEM_LIMIT:-2600m}
    cpus: ${SIGLIP2_CPUS:-4.0}
    networks:
      - aidnet
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  dinov3:
    build:
      context: ../services/dinov3-server
      dockerfile: Dockerfile
    image: dinov3-embed:cpu
    container_name: dinov3-embed
    restart: unless-stopped
    ports:
      - "${DINOV3_HOST_PORT:-127.0.0.1:8091}:8091"
    env_file:
      - embeddings.env
    environment:
      DEVICE: ${DINOV3_DEVICE:-cpu}
      DINO_MODEL: ${DINO_MODEL:-facebook/dinov3-vitb16-pretrain-lvd1689m}
      DINO_API_KEY: ${DINO_API_KEY:-${EMBED_API_KEY:-}}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL:-0}
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      TORCH_NUM_THREADS: ${DINOV3_TORCH_THREADS:-2}
      OMP_NUM_THREADS: ${DINOV3_TORCH_THREADS:-2}
      DNNL_MAX_CPU_ISA: SSE41
      ATEN_CPU_CAPABILITY: default
      HF_HOME: /cache/huggingface
    volumes:
      - ${DINOV3_HF_CACHE_HOST:-/var/lib/vino-svoe/hf-cache/dinov3}:/cache/huggingface
    mem_limit: ${DINOV3_MEM_LIMIT:-2400m}
    cpus: ${DINOV3_CPUS:-2.0}
    networks:
      - aidnet
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8091/health"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 600s

networks:
  aidnet:
    name: ${AIDNET_NAME:-aidispatcher_aidnet}
    external: true
