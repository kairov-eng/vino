# Cross-Encoder matcher — отдельный стек, сеть aidispatcher_aidnet для nginx.
services:
  cross_encoder:
    build: .
    image: cross-encoder-matcher:cpu
    container_name: cross-encoder-matcher
    restart: unless-stopped
    ports:
      - "127.0.0.1:8094:8094"
    environment:
      DEVICE: cpu
      CRENC_MODEL_DIR: /model
      CRENC_API_KEY: ${CRENC_API_KEY:-}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      CRENC_MAX_LENGTH: ${CRENC_MAX_LENGTH:-160}
      CRENC_BATCH_SIZE: ${CRENC_BATCH_SIZE:-32}
      # VPS: 4 vCPU без AVX — больше потоков ощутимо помогают на батче pairs
      TORCH_NUM_THREADS: "4"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      DNNL_MAX_CPU_ISA: SSE41
      ATEN_CPU_CAPABILITY: default
    volumes:
      - ./model:/model:ro
    mem_limit: 2200m
    cpus: 3.5
    networks:
      - default
      - aidnet

networks:
  aidnet:
    external: true
    name: aidispatcher_aidnet
